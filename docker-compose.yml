# ✅ ЯКОРЬ: Декларация общих параметров для минимизации дублирования (DRY)
x-common-service: &common-service
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - alert_network
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  # =========================================================================
  # ИНФРАСТРУКТУРНЫЙ СЛОЙ (БРОКЕР И СУБД МЕДЖЕРЫ)
  # =========================================================================

  # FILE: docker-compose.yml

  redis:
    image: redis:7.2-alpine
    container_name: odesa_alert_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is strictly required in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      # БЫЛО: test: ["CMD", "redis-cli", "ping"]
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - alert_network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: odesa_alert_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Начинаем скрейпить метрики только тогда, когда сам Редис ответил на PING
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alert_network

  # Слой миграции данных (база Супабейса внешняя, но таблицы апдейтим локально)
  migrator:
    <<: *common-service
    container_name: odesa_alert_migrator
    command: python -m alert_bot_project.database.migration
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    # ✅ СИНХРОНИЗАЦИЯ: Мигратор ждет, пока поднимется транспортная шина
    depends_on:
      redis:
        condition: service_healthy

  # =========================================================================
  # СЛОЙ БИЗНЕС-ЛОГИКИ ПРИЛОЖЕНИЯ (PYTHON / ASYNCIO)
  # =========================================================================

  scraper:
    <<: *common-service
    container_name: odesa_alert_scraper
    command: python -m alert_bot_project.scraper.main
    volumes:
      - ./data/session:/data/session:z
      - shared_logs:/data/logs
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Запуск только после успешного завершения миграции схемы и прогрева Редиса
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    <<: *common-service
    container_name: odesa_alert_worker
    command: python -m alert_bot_project.worker.main
    volumes:
      - shared_logs:/data/logs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  bot_ui:
    <<: *common-service
    container_name: odesa_alert_bot_ui
    command: python -m alert_bot_project.bot.main
    volumes:
      - shared_logs:/data/logs
      # Кладіть сюди свої власні mp3 (не входять в git/образ) — бот підхопить їх
      # автоматично в меню "🔊 Оберіть звук сповіщення". Див. README.md → "Кастомні звуки сповіщень"
      - ./data/custom_sounds:/data/custom_sounds:ro,z
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # =========================================================================
  # СЛОЙ МОНИТОРИНГА И НАБЛЮДАЕМОСТИ (OBSERVABILITY STACK)
  # =========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: odesa_alert_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      bot_ui:
        condition: service_healthy
      redis-exporter:
        condition: service_started
    networks:
      - alert_network

  # ✅ ФИКС: Сам бінарник Alertmanager НЕ вміє підставляти ${ENV_VAR} у свій YAML-конфіг —
  # це не docker-compose підстановка, а буквальний текст, який Alertmanager намагається
  # розпарсити як є (chat_id: ${ADMIN_CHAT_ID} падає з "cannot unmarshal !!str into int64").
  # Тому конфіг рендеримо заздалегідь через envsubst в окремому одноразовому контейнері.
  alertmanager-config:
    image: alpine:3.20
    container_name: odesa_alert_alertmanager_config
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
    volumes:
      - ./prometheus/alertmanager.yml.template:/template/alertmanager.yml.template:ro,z
      - alertmanager_config:/rendered
    command: >
      sh -c "apk add --no-cache gettext > /dev/null &&
             envsubst '$${BOT_TOKEN} $${ADMIN_CHAT_ID}' < /template/alertmanager.yml.template > /rendered/alertmanager.yml"
    restart: "no"
    networks:
      - alert_network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: odesa_alert_alertmanager
    restart: unless-stopped
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    volumes:
      - alertmanager_config:/etc/alertmanager:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - alert_network

  grafana:
    image: grafana/grafana:latest
    container_name: odesa_alert_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is strictly required in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    ports:
      - "127.0.0.1:3000:3000"
    # Графана стартует только тогда, когда Прометей полностью готов отдавать данные
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - alert_network

volumes:
  redis_data:
    driver: local
  shared_logs:
    driver: local
  alertmanager_config:
    driver: local

networks:
  alert_network:
    driver: bridge