name: OdesaAlert Core CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      # Поднимаем реальный Redis прямо в контейнере GitHub для интеграционных тестов
      redis:
        image: redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout source code code layout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python environment environment (3.11)
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install production and dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.lock
        pip install -r requirements-dev.txt

    - name: Run Ruff Linter Engine (Static Analysis)
      run: ruff check .

    - name: Run Ruff Code Formatter Verification
      run: ruff format --check .

    - name: Run Mypy Strict Type Checking
      run: mypy alert_bot_project/

    - name: Run Bandit Security Vulnerability Audit
      run: bandit -c pyproject.toml -r alert_bot_project/

    - name: Start disposable Redis ACL and limited exporter fixtures
      run: |
        python - <<'PY'
        import os, secrets
        from pathlib import Path
        from alert_bot_project.core_shared.redis_acl import USERS
        from alert_bot_project.scripts.build_redis_acl import compile_credentials
        directory = Path(os.environ['RUNNER_TEMP']) / 'redis-acl'
        directory.mkdir(mode=0o700)
        for role in USERS:
            path = directory / f'redis_{role}_password'
            path.write_text(secrets.token_hex(32))
            path.chmod(0o600)
        compile_credentials(directory, directory / 'users.acl', directory / 'exporter.json')
        for name in ('users.acl', 'exporter.json'):
            (directory / name).chmod(0o444)
        PY
        docker network create alert-bot-acl-ci
        docker run -d --name alert-bot-acl-test --network alert-bot-acl-ci --network-alias redis \
          -p 127.0.0.1:6380:6379 \
          -v "$RUNNER_TEMP/redis-acl/users.acl:/run/secrets/users.acl:ro" \
          redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0 \
          redis-server --aclfile /run/secrets/users.acl --appendonly no --save ""
        docker run -d --name alert-bot-acl-exporter --network alert-bot-acl-ci \
          -p 127.0.0.1:9122:9121 \
          -v "$RUNNER_TEMP/redis-acl/exporter.json:/run/secrets/redis_exporter_credentials:ro" \
          -e REDIS_ADDR=redis://redis:6379 -e REDIS_USER=alert_monitor \
          -e REDIS_PASSWORD_FILE=/run/secrets/redis_exporter_credentials \
          -e REDIS_EXPORTER_CONFIG_COMMAND=- -e REDIS_EXPORTER_EXPORT_CLIENT_LIST=false \
          -e REDIS_EXPORTER_DISABLE_EXPORTING_KEY_VALUES=true \
          oliver006/redis_exporter@sha256:ca3abd5f19da6c87e96038ba08aaa3dfaab34dc649834584c4d6880b05952fef

    - name: Run Complete Pytest Suite Engine (Units & Integration)
      env:
        # Подсовываем фейковые переменные для прохождения тестов конфигурации Pydantic
        BOT_TOKEN: "123456:fake_token"
        GROUP_ID: "-100123456"
        API_ID: "123456"
        API_HASH: "fake_hash"
        LOG_PSEUDONYM_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
        MIGRATION_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
        MIGRATION_LOCAL_TEST: "1"
        REDIS_URL: "redis://localhost:6379/0"
        ACL_TEST_SECRET_DIR: ${{ runner.temp }}/redis-acl
      run: pytest

    - name: Validate complete ASVS 5.0.0 evidence registry
      run: python -m alert_bot_project.scripts.validate_asvs

    - name: Audit locked dependencies and generate SBOM
      run: |
        python -m pip install pip-audit==2.10.1
        python -m pip_audit -r requirements.lock --disable-pip --format cyclonedx-json --output sbom.json

    - name: Verify container image builds from locked dependencies
      run: docker build --pull -t alert-bot:ci .

    - name: Validate rendered Compose service credential boundaries
      env:
        GRAFANA_PASSWORD: ci_only_not_a_real_secret
      run: |
        for service in worker bot_ui scraper migrator; do
          cp "deploy/$service.env.example" ".env.$service"
        done
        docker compose config --format json | python -m alert_bot_project.scripts.validate_service_environment

    - name: Validate Alertmanager and Prometheus rules
      run: |
        mkdir -p "$RUNNER_TEMP/alertmanager-secrets"
        printf '123456:ci-test' > "$RUNNER_TEMP/alertmanager-secrets/alertmanager_bot_token"
        printf '123456' > "$RUNNER_TEMP/alertmanager-secrets/alertmanager_chat_id"
        docker run --rm --entrypoint=/bin/amtool \
          -v "$GITHUB_WORKSPACE/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
          -v "$RUNNER_TEMP/alertmanager-secrets:/run/secrets:ro" \
          prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a \
          check-config /etc/alertmanager/alertmanager.yml
        docker run --rm --entrypoint=/bin/promtool \
          -v "$GITHUB_WORKSPACE/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
          prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
          check rules /etc/prometheus/alerts.yml

    - name: Save release SBOM
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: python-sbom
        path: sbom.json

    - name: Stop disposable ACL fixtures
      if: always()
      run: |
        docker rm -f alert-bot-acl-test alert-bot-acl-exporter || true
        docker network rm alert-bot-acl-ci || true
